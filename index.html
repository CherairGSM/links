<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cherair GSM | Liens Officiels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            position: fixed; 
            touch-action: none; 
        }

        body { 
            background: #060a12;
            display: flex;
            align-items: flex-start; /* Move content up */
            justify-content: center;
            padding-top: 5vh; /* Initial top spacing */
        }

        #starfield {
            position: absolute;
            inset: 0;
            z-index: -2;
            pointer-events: none;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            box-shadow: 0 0 3px rgba(255, 255, 255, 0.3);
            animation: chaos var(--duration) infinite linear;
        }

        .trail {
            position: absolute;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
            border-radius: 1px;
            pointer-events: none;
            animation: fade var(--trail-fade) linear forwards;
            opacity: 0;
        }

        @keyframes chaos {
            0% { transform: translate(0, 0); }
            25% { transform: translate(var(--x1), var(--y1)); }
            50% { transform: translate(var(--x2), var(--y2)); }
            75% { transform: translate(var(--x3), var(--y3)); }
            100% { transform: translate(0, 0); }
        }

        @keyframes fade {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        .bg-mesh {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(52, 168, 83, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(24, 119, 242, 0.08) 0%, transparent 50%);
            z-index: -1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes logoSubtle {
            0%, 100% { 
                transform: scale(1); 
                filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.05));
            }
            50% { 
                transform: scale(1.02); 
                filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.2)); 
            }
        }

        .animate-float { animation: float 3.5s ease-in-out infinite; }
        .animate-logo-subtle { animation: logoSubtle 5s ease-in-out infinite; }
        .delay-1 { animation-delay: 0.4s; }
        .delay-2 { animation-delay: 0.8s; }

        .ig-stroke {
            border: 3px solid transparent;
            background: linear-gradient(white, white) padding-box, 
                        linear-gradient(45deg, #f09433 0%, #dc2743 50%, #bc1888 100%) border-box;
        }
    </style>
</head>
<body class="text-white text-center">

    <div id="starfield"></div>
    <div class="bg-mesh"></div>

    <div class="relative z-10 flex flex-col items-center">
        <div class="mb-2 animate-logo-subtle">
            <img src="logo.png" alt="Cherair GSM" class="w-[420px] md:w-[750px] mx-auto pointer-events-none">
        </div>

        <div class="max-w-[320px] mb-8 px-2">
            <p class="text-white text-[12px] leading-relaxed font-black uppercase tracking-[0.25em]">
                Smartphones • Accessoires Authentiques • Sidi Aïssa
            </p>
            <div class="mt-3 w-10 h-[1px] bg-white/30 mx-auto"></div>
        </div>

        <div class="flex gap-8 md:gap-14">
            <a href="https://www.instagram.com/mostafacherair?igsh=MW9jd211NWJqZWIzbQ==" target="_blank" class="flex flex-col items-center group animate-float">
                <div class="w-16 h-16 bg-white rounded-[22px] flex items-center justify-center p-3.5 ig-stroke shadow-2xl transition-transform group-active:scale-90">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" class="w-full h-full">
                </div>
                <span class="mt-3 text-[10px] font-black text-gray-500 tracking-widest uppercase">Instagram</span>
            </a>

            <a href="https://www.facebook.com/CherairGSM" target="_blank" class="flex flex-col items-center group animate-float delay-1">
                <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center p-3.5 border-[3px] border-[#1877F2] shadow-2xl transition-transform group-active:scale-90">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg" class="w-full h-full">
                </div>
                <span class="mt-3 text-[10px] font-black text-gray-500 tracking-widest uppercase">Facebook</span>
            </a>

            <a href="https://maps.app.goo.gl/HVdtzN1DDqSx1EWBA" target="_blank" class="flex flex-col items-center group animate-float delay-2">
                <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center p-3 border-[3px] border-[#34A853] shadow-2xl transition-transform group-active:scale-90 overflow-hidden">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/a/aa/Google_Maps_icon_%282020%29.svg" alt="Maps" class="w-[80%] h-[80%] object-contain">
                </div>
                <span class="mt-3 text-[10px] font-black text-gray-500 tracking-widest uppercase">Localisation</span>
            </a>
        </div>
    </div>

    <footer class="absolute bottom-6 text-gray-700 text-[9px] font-bold tracking-[0.6em] uppercase pointer-events-none">
        Cherair GSM • Algérie
    </footer>

    <script>
        const container = document.getElementById('starfield');
        const starCount = 35; 
        const trailFadeTime = 2000; 

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = (Math.random() * 0.5 + 1) + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.background = `rgba(255, 255, 255, ${Math.random() * 0.3 + 0.3})`; 
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            const duration = (Math.random() * 40 + 70) + 's';
            star.style.setProperty('--duration', duration);
            star.style.setProperty('--x1', (Math.random() * 500 - 250) + 'px');
            star.style.setProperty('--y1', (Math.random() * 500 - 250) + 'px');
            star.style.setProperty('--x2', (Math.random() * 500 - 250) + 'px');
            star.style.setProperty('--y2', (Math.random() * 500 - 250) + 'px');
            star.style.setProperty('--x3', (Math.random() * 500 - 250) + 'px');
            star.style.setProperty('--y3', (Math.random() * 500 - 250) + 'px');
            container.appendChild(star);

            setInterval(() => {
                const rect = star.getBoundingClientRect();
                const trail = document.createElement('div');
                trail.className = 'trail';
                trail.style.width = '0.5px'; 
                trail.style.height = '12px'; 
                trail.style.left = rect.left + 'px';
                trail.style.top = rect.top + 'px';
                trail.style.setProperty('--trail-fade', trailFadeTime + 'ms');
                container.appendChild(trail);
                setTimeout(() => trail.remove(), trailFadeTime);
            }, 350); 
        }
    </script>
</body>
</html>
